<!DOCTYPE html>
<html lang="en">
<head>
    <title>OTP Numbers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        /* Footer styles (kept here for simplicity) */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #020617;
            border-top: 1px solid #1e293b;
            padding: 12px 16px;
            z-index: 100;
        }

        .footer .footer-btn {
            display: block;
            max-width: 420px;
            margin: auto;
            text-align: center;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #ffffff;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }

        /* Prevent footer overlap */
        .container {
            padding-bottom: 90px;
        }
    </style>
</head>

<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <a
            class="footer-btn"
            href="https://t.me/shivam_cingh?text=I have a problem with order {{ order_id }}"
            target="_blank"
        >
            💬 Contact Support on Telegram
        </a>
    </div>
</body>
</html>
